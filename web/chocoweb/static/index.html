<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choco</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'choco-bg':      '#0D0F14',
            'choco-panel':   '#0F1E35',
            'choco-surface': '#162B4A',
            'choco-accent':  '#2D8CFF',
            'choco-glow':    '#5BACFF',
            'choco-text':    '#E8F1FF',
            'choco-muted':   '#6B8CAE',
            'choco-active':  '#00D4AA',
            'choco-end':     '#FF4D6D',
            'choco-divider': '#1E3A5F',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="bg-choco-bg text-choco-text flex flex-col font-sans">

  <!-- Full-width session status bar — spans viewport, hidden during setup -->
  <div id="session-bar" class="hidden">
    <span id="status-label" class="text-sm text-choco-muted">Listening...</span>
    <button id="end-btn" class="end-btn">End Session</button>
  </div>

  <div id="app" class="flex flex-col flex-1 min-h-0 gap-5 w-full max-w-lg mx-auto px-4 py-6">

    <!-- Character -->
    <div id="character-wrap" class="w-full flex items-center justify-center relative">
      <div id="char-ring"></div>
      <div id="character" class="state-sleeping"></div>
    </div>

    <!-- Title (hidden during session) -->
    <div id="choco-title" class="text-center -mt-1">
      <h1 class="text-2xl font-bold tracking-tight">Choco</h1>
      <p class="text-sm text-choco-muted mt-0.5">Your language tutor</p>
    </div>

    <!-- Setup panel -->
    <div id="setup-panel" class="glass-card w-full">

      <div>
        <p class="section-label">Profile</p>
        <div id="profile-picker" class="flex flex-wrap gap-3 justify-center"></div>
      </div>

      <div class="border-t border-choco-divider"></div>

      <div>
        <p class="section-label">Language</p>
        <div id="language-picker"></div>
      </div>

      <button id="start-btn" disabled class="start-btn">Start Session</button>

      <p id="error-msg" class="text-choco-end text-sm text-center hidden"></p>
    </div>

    <!-- Session panel — flex-1 so transcript fills to bottom of viewport -->
    <div id="session-panel" class="hidden w-full flex flex-col flex-1 min-h-0">
      <div id="transcript"></div>
    </div>

  </div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
